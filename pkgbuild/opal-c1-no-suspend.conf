## Never suspend or pause the Opal C1's microphone.
## The camera's firmware hangs for good (no video, no USB, until it is unplugged) when its
## microphone is stopped and started again in quick succession, which is what happens when
## an app starts recording just as PipeWire releases the idle device. Keeping the capture
## stream open means the camera sees one start and no stops. Only matters with C1 Tune's
## Microphone switched on; with it off the camera has no audio pipeline to upset.

monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_input.usb-Opal_Opal_C1.*"
      }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
        node.pause-on-idle = false
      }
    }
  }
]
